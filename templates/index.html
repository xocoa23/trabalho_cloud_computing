<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeployLog — comprovante de deploy</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --papel:  #E4E7EB;
      --folha:  #FBFBFC;
      --tinta:  #16191D;
      --apagado:#737A85;
      --linha:  #CBD0D6;
      --destaque:#2F5D8C;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      background: var(--papel);
      color: var(--tinta);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      line-height: 1.5;
    }

    .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }

    .comprovante {
      width: 100%;
      max-width: 600px;
      background: var(--folha);
      padding: 3rem 2.75rem 2.5rem;
      border-radius: 8px;
      box-shadow: 0 16px 36px -20px rgba(20, 25, 30, 0.5);
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.015em;
    }

    .sub {
      margin: 0 0 2rem;
      color: var(--apagado);
      font-size: 1.05rem;
    }

    dl { margin: 0; }

    .campo {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      padding: 0.85rem 0;
      border-bottom: 1px dotted var(--linha);
    }

    .campo:first-child { border-top: 1px dotted var(--linha); }

    dt { color: var(--apagado); font-size: 1rem; }
    dd { margin: 0 0 0 auto; font-size: 1.05rem; text-align: right; word-break: break-all; }

    .botao {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.65rem 1.1rem;
      background: var(--tinta);
      color: var(--folha);
      border-radius: 4px;
      font-size: 1rem;
      text-decoration: none;
    }

    .conferido {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin: 2rem 0 0;
      font-size: 1rem;
    }

    .avatar { width: 30px; height: 30px; border-radius: 50%; }

    .link {
      margin-left: auto;
      color: var(--destaque);
      font-size: 0.95rem;
    }

    a:focus-visible { outline: 2px solid var(--destaque); outline-offset: 2px; }

    @media (max-width: 480px) {
      .comprovante { padding: 2rem 1.5rem; }
      h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>

  <article class="comprovante">
    <h1>Comprovante de deploy</h1>
    <p class="sub">Esta página descreve a imagem que está rodando neste servidor.</p>

    <dl>
      <div class="campo">
        <dt>Commit</dt>
        <dd class="mono">{{ commit[:7] }}</dd>
      </div>
      <div class="campo">
        <dt>Build gerado em</dt>
        <dd class="mono">{{ build_time }}</dd>
      </div>
    </dl>

    {% if usuario %}
      <p class="conferido">
        <img class="avatar" src="{{ usuario.avatar }}" alt="">
        Conferido por {{ usuario.login }}.
        <a class="link" href="{{ url_for('sair') }}">Sair</a>
      </p>
    {% elif login_ativo %}
      <a class="botao" href="{{ url_for('entrar') }}">Entrar com GitHub</a>
    {% endif %}
  </article>

</body>
</html>
