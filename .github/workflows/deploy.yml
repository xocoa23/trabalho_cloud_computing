name: Build e deploy no Azure

# A cada push na main o workflow constroi a imagem e publica no ACR.
# O Web App esta com deploy continuo ligado, entao ele detecta a imagem
# nova e se atualiza sozinho. Nao e preciso autenticar no Azure aqui.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar no Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_SERVIDOR }}
          username: ${{ secrets.ACR_USUARIO }}
          password: ${{ secrets.ACR_SENHA }}

      - name: Construir e publicar a imagem
        run: |
          docker build \
            --build-arg APP_COMMIT=${{ github.sha }} \
            --build-arg APP_BUILD_TIME="$(date -u '+%d/%m/%Y %H:%M UTC')" \
            -t ${{ secrets.ACR_SERVIDOR }}/deploylog:latest \
            .
          docker push ${{ secrets.ACR_SERVIDOR }}/deploylog:latest
